# Host port 5433 avoids clashing with a local PostgreSQL install on 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: goal-portal-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goal_portal
    volumes:
      - goal_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goal_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  goal_portal_pgdata:
